<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Statigo — Screenshots</title>
    <style>
      body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;margin:0;padding:2rem;background:#0b0f14;color:#e6eef6}
      h1{margin:0 0 1rem}
      .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
      .card{background:rgba(255,255,255,0.04);padding:8px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.4)}
      img{max-width:100%;height:auto;border-radius:6px;display:block}
      .caption{font-size:0.9rem;margin-top:8px;color:#cfe7ff}
      header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
      a.button{background:#00aaff;color:#031024;padding:8px 12px;border-radius:6px;text-decoration:none}
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Statigo — Screenshots</h1>
        <p>Browse screenshots from the app. Click any image to open in a new tab.</p>
      </div>
      <div>
        <a class="button" href="https://github.com/nimishvarshneyofficial/Statigo">View repo</a>
      </div>
    </header>
    <main>
      <div class="gallery">
        <div class="card"><a href="assets/screenshots/hero_banner.png" target="_blank"><img src="assets/screenshots/hero_banner.png" alt="Hero banner"/></a><div class="caption">Hero banner</div></div>
        <div class="card"><a href="assets/screenshots/feature_explainer.png" target="_blank"><img src="assets/screenshots/feature_explainer.png" alt="Feature explainer"/></a><div class="caption">Feature explainer</div></div>
        <div class="card"><a href="assets/screenshots/mockup_overview.png" target="_blank"><img src="assets/screenshots/mockup_overview.png" alt="Overview mockup"/></a><div class="caption">Mockup overview</div></div>
        <div class="card"><a href="assets/screenshots/mockup_signin.png" target="_blank"><img src="assets/screenshots/mockup_signin.png" alt="Sign-in mockup"/></a><div class="caption">Sign-in mockup</div></div>
        <div class="card"><a href="assets/screenshots/mockup_premium.png" target="_blank"><img src="assets/screenshots/mockup_premium.png" alt="Premium mockup"/></a><div class="caption">Premium mockup</div></div>
        <div class="card"><a href="assets/screenshots/showcase_collage.png" target="_blank"><img src="assets/screenshots/showcase_collage.png" alt="Showcase collage"/></a><div class="caption">Showcase collage</div></div>
        <div class="card"><a href="assets/screenshots/social_preview.png" target="_blank"><img src="assets/screenshots/social_preview.png" alt="Social preview"/></a><div class="caption">Social preview</div></div>
        <div class="card"><a href="assets/screenshots/logo_gradient.png" target="_blank"><img src="assets/screenshots/logo_gradient.png" alt="Logo gradient"/></a><div class="caption">Logo gradient</div></div>
      </div>
    </main>
  </body>
</html>
